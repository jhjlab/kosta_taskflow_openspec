<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - 칸반</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.card-dragging { opacity:0.4; }
.column-over { background-color:#e0f2fe; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white shadow px-4 py-3 flex items-center gap-4 flex-wrap">
  <span class="bg-teal-600 text-white px-3 py-1 rounded font-bold">TaskFlow</span>
  <span id="team-name" class="font-medium text-gray-700"></span>
  <nav class="flex gap-2 ml-auto">
    <a href="/kanban.html" class="px-3 py-1 bg-teal-600 text-white rounded text-sm">칸반</a>
    <a href="/chat.html" class="px-3 py-1 bg-white border rounded text-sm hover:bg-gray-50">채팅</a>
    <a href="#" onclick="showMembers()" class="px-3 py-1 bg-white border rounded text-sm hover:bg-gray-50">멤버</a>
  </nav>
  <span id="user-email" class="text-sm text-gray-500 hidden md:block"></span>
  <button onclick="doLogout()" class="text-sm text-gray-500 hover:text-red-500">로그아웃</button>
</header>

<div class="p-4">
  <div class="flex gap-2 mb-4 flex-wrap">
    <button onclick="setFilter('all')" id="f-all" class="px-3 py-1 rounded text-sm bg-gray-800 text-white">전체</button>
    <button onclick="setFilter('me')" id="f-me" class="px-3 py-1 rounded text-sm bg-white border">@me</button>
    <button onclick="setFilter('unassigned')" id="f-unassigned" class="px-3 py-1 rounded text-sm bg-white border">미할당</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div id="col-TODO" class="bg-yellow-50 rounded-xl p-3" ondragover="onDragOver(event,'TODO')" ondrop="onDrop(event,'TODO')" ondragleave="onDragLeave(event)">
      <div class="flex justify-between items-center mb-3">
        <span class="font-bold text-yellow-700">TODO · <span id="cnt-TODO">0</span></span>
        <button onclick="startAdd('TODO')" class="text-teal-600 text-xl font-bold hover:text-teal-800">+</button>
      </div>
      <div id="add-TODO" class="hidden mb-2">
        <input id="newtitle-TODO" class="w-full border rounded px-2 py-1 text-sm mb-1" placeholder="태스크 제목">
        <div class="flex gap-2">
          <button onclick="addTask('TODO')" class="flex-1 bg-teal-600 text-white text-sm py-1 rounded">Enter</button>
          <button onclick="cancelAdd('TODO')" class="flex-1 bg-white border text-sm py-1 rounded">취소</button>
        </div>
      </div>
      <div id="cards-TODO" class="space-y-2 min-h-10"></div>
    </div>

    <div id="col-DOING" class="bg-blue-50 rounded-xl p-3" ondragover="onDragOver(event,'DOING')" ondrop="onDrop(event,'DOING')" ondragleave="onDragLeave(event)">
      <div class="flex justify-between items-center mb-3">
        <span class="font-bold text-blue-700">DOING · <span id="cnt-DOING">0</span></span>
        <button onclick="startAdd('DOING')" class="text-teal-600 text-xl font-bold hover:text-teal-800">+</button>
      </div>
      <div id="add-DOING" class="hidden mb-2">
        <input id="newtitle-DOING" class="w-full border rounded px-2 py-1 text-sm mb-1" placeholder="태스크 제목">
        <div class="flex gap-2">
          <button onclick="addTask('DOING')" class="flex-1 bg-teal-600 text-white text-sm py-1 rounded">Enter</button>
          <button onclick="cancelAdd('DOING')" class="flex-1 bg-white border text-sm py-1 rounded">취소</button>
        </div>
      </div>
      <div id="cards-DOING" class="space-y-2 min-h-10"></div>
    </div>

    <div id="col-DONE" class="bg-green-50 rounded-xl p-3" ondragover="onDragOver(event,'DONE')" ondrop="onDrop(event,'DONE')" ondragleave="onDragLeave(event)">
      <div class="flex justify-between items-center mb-3">
        <span class="font-bold text-green-700">DONE · <span id="cnt-DONE">0</span></span>
        <button onclick="startAdd('DONE')" class="text-teal-600 text-xl font-bold hover:text-teal-800">+</button>
      </div>
      <div id="add-DONE" class="hidden mb-2">
        <input id="newtitle-DONE" class="w-full border rounded px-2 py-1 text-sm mb-1" placeholder="태스크 제목">
        <div class="flex gap-2">
          <button onclick="addTask('DONE')" class="flex-1 bg-teal-600 text-white text-sm py-1 rounded">Enter</button>
          <button onclick="cancelAdd('DONE')" class="flex-1 bg-white border text-sm py-1 rounded">취소</button>
        </div>
      </div>
      <div id="cards-DONE" class="space-y-2 min-h-10"></div>
    </div>
  </div>
</div>

<!-- 태스크 상세 모달 -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-40">
  <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm mx-4">
    <div class="flex justify-between items-center mb-4">
      <span id="modal-id" class="text-sm text-gray-400"></span>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-xl">✕</button>
    </div>
    <input id="modal-title" class="w-full border rounded px-3 py-2 mb-3 font-medium" placeholder="제목">
    <div class="flex gap-2 mb-3">
      <button onclick="setModalStatus('TODO')" id="ms-TODO" class="flex-1 border rounded py-1 text-sm">TODO</button>
      <button onclick="setModalStatus('DOING')" id="ms-DOING" class="flex-1 border rounded py-1 text-sm">DOING</button>
      <button onclick="setModalStatus('DONE')" id="ms-DONE" class="flex-1 border rounded py-1 text-sm">DONE</button>
    </div>
    <div class="flex gap-2">
      <button onclick="saveModal()" class="flex-1 bg-teal-600 text-white py-2 rounded">저장</button>
      <button onclick="deleteModalTask()" class="flex-1 bg-white border border-red-300 text-red-500 py-2 rounded">삭제</button>
    </div>
  </div>
</div>

<!-- 멤버 모달 -->
<div id="member-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-40">
  <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm mx-4">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold">팀 멤버</h3>
      <button onclick="closeMemberModal()" class="text-gray-400 hover:text-gray-700 text-xl">✕</button>
    </div>
    <div id="member-list" class="space-y-2"></div>
  </div>
</div>

<script src="/static/js/auth.js"></script>
<script src="/static/js/api.js"></script>
<script>
if (!requireAuth()) {}
const user = getCurrentUser();
if (user && !user.team_id) location.href = '/team.html';
if (user) document.getElementById('user-email').textContent = user.email;

let tasks = [], currentFilter = 'all', dragTaskId = null, modalTaskId = null, modalStatus = null;

async function loadTeam() {
  if (!user?.team_id) return;
  const t = await api.get(`/teams/${user.team_id}`);
  if (t) document.getElementById('team-name').textContent = t.name + ' 팀';
}

async function loadTasks() {
  const url = `/teams/${user.team_id}/tasks${currentFilter !== 'all' ? '?filter=' + currentFilter : ''}`;
  const data = await api.get(url);
  if (!data) return;
  tasks = data;
  renderTasks();
}

function renderTasks() {
  ['TODO','DOING','DONE'].forEach(s => {
    const container = document.getElementById('cards-' + s);
    const filtered = tasks.filter(t => t.status === s);
    document.getElementById('cnt-' + s).textContent = filtered.length;
    container.innerHTML = filtered.map(t => `
      <div class="bg-white rounded shadow px-3 py-2 cursor-pointer hover:shadow-md"
           draggable="true"
           ondragstart="onDragStart(event,${t.id})"
           ondragend="onDragEnd(event)"
           onclick="openModal(${t.id})">
        <p class="text-sm font-medium">${escHtml(t.title)}</p>
        <p class="text-xs text-gray-400 mt-1">#${t.id}${t.assignee_id ? ' · @' + t.assignee_id : ' · ⚠미할당'}</p>
      </div>`).join('');
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setFilter(f) {
  currentFilter = f;
  ['all','me','unassigned'].forEach(k => {
    document.getElementById('f-'+k).className = `px-3 py-1 rounded text-sm ${k===f?'bg-gray-800 text-white':'bg-white border'}`;
  });
  loadTasks();
}

function startAdd(s) {
  document.getElementById('add-'+s).classList.remove('hidden');
  document.getElementById('newtitle-'+s).focus();
}
function cancelAdd(s) {
  document.getElementById('add-'+s).classList.add('hidden');
  document.getElementById('newtitle-'+s).value = '';
}
async function addTask(s) {
  const title = document.getElementById('newtitle-'+s).value.trim();
  if (!title) return;
  const data = await api.post(`/teams/${user.team_id}/tasks`, { title, status: s });
  if (!data) return;
  cancelAdd(s); loadTasks();
}

function onDragStart(e, id) { dragTaskId = id; e.target.classList.add('card-dragging'); e.dataTransfer.effectAllowed = 'move'; }
function onDragEnd(e) { e.target.classList.remove('card-dragging'); document.querySelectorAll('.column-over').forEach(el => el.classList.remove('column-over')); }
function onDragOver(e, s) { e.preventDefault(); document.getElementById('col-'+s).classList.add('column-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('column-over'); }
async function onDrop(e, s) {
  e.preventDefault();
  e.currentTarget.classList.remove('column-over');
  if (dragTaskId == null) return;
  const task = tasks.find(t => t.id === dragTaskId);
  if (task && task.status !== s) {
    task.status = s; renderTasks();
    await api.patch(`/tasks/${dragTaskId}/status`, { status: s });
    loadTasks();
  }
  dragTaskId = null;
}

function openModal(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  modalTaskId = id; modalStatus = t.status;
  document.getElementById('modal-id').textContent = '#' + id;
  document.getElementById('modal-title').value = t.title;
  setModalStatus(t.status, false);
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); modalTaskId = null; }
function setModalStatus(s, save=true) {
  modalStatus = s;
  ['TODO','DOING','DONE'].forEach(k => {
    document.getElementById('ms-'+k).className = `flex-1 border rounded py-1 text-sm ${k===s?'bg-teal-600 text-white border-teal-600':''}`;
  });
}
async function saveModal() {
  if (!modalTaskId) return;
  const title = document.getElementById('modal-title').value.trim();
  if (title) await api.put(`/tasks/${modalTaskId}`, { title });
  const t = tasks.find(x => x.id === modalTaskId);
  if (t && t.status !== modalStatus) await api.patch(`/tasks/${modalTaskId}/status`, { status: modalStatus });
  closeModal(); loadTasks();
}
async function deleteModalTask() {
  if (!modalTaskId) return;
  const ok = await showConfirm('이 카드를 삭제하시겠습니까? 되돌릴 수 없습니다.');
  if (!ok) return;
  await api.del(`/tasks/${modalTaskId}`);
  closeModal(); loadTasks();
}

async function showMembers() {
  const data = await api.get(`/teams/${user.team_id}/members`);
  if (!data) return;
  document.getElementById('member-list').innerHTML = data.map(m => `
    <div class="flex items-center gap-3 py-2 border-b">
      <div class="w-8 h-8 rounded-full bg-teal-600 text-white flex items-center justify-center font-bold text-sm">${m.email[0].toUpperCase()}</div>
      <div><p class="text-sm font-medium">${escHtml(m.email)}${m.email === user?.email ? ' (나)' : ''}</p>
      <p class="text-xs text-gray-400">${m.is_owner ? '★ owner' : 'member'}</p></div>
    </div>`).join('');
  document.getElementById('member-modal').classList.remove('hidden');
}
function closeMemberModal() { document.getElementById('member-modal').classList.add('hidden'); }

async function doLogout() {
  await api.post('/auth/logout'); removeToken(); location.href = '/login.html';
}

loadTeam(); loadTasks();
</script>
</body>
</html>
